[package]
name = "coldflow-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-modbus = { version = "0.14", features = [ "rtu"] }
tokio-serial = "5.4"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"